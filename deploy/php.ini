; Settings of the PHP that runs the mosque system on the mosque laptop.
; start.bat copies this file into the "php" folder, where that PHP reads it.
; How much memory and time PHP may use, and how large an upload may be, is
; not set here: deploy\serve.bat gives those to whatever PHP it starts.

[PHP]
extension_dir = "ext"

; What Laravel and the admin panel need.
extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_mysql
extension = zip
extension = sodium
extension = exif

; Attendance is recorded against "today": the clock is the mosque's.
date.timezone = "Asia/Damascus"

; A user of the system must never see a PHP error page; errors go to storage\logs.
display_errors = Off
log_errors = On
error_reporting = E_ALL

default_charset = "UTF-8"

[opcache]
; Keeps the compiled code of the system in memory: pages open much faster.
zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The files only change when the system is updated, and it is restarted then.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
